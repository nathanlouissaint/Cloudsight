name: CloudSight Docker

on:
  push:
    branches:
      - main
      - develop
      - release/frontend-homepage-only
      - feature/**
      - feat/**
  pull_request:
    branches:
      - main
      - develop
      - release/frontend-homepage-only

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Validate Production Docker

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      POSTGRES_PASSWORD: ci-test-password
      DATABASE_URL: postgresql://cloudsight:ci-test-password@postgres:5432/cloudsight
      JWT_SECRET: ci-only-disposable-secret-not-for-production-123456789
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      AWS_REGION: us-east-1
      SERVER_IMAGE: cloudsight-server:ci
      SERVER_MIGRATOR_IMAGE: cloudsight-migrator:ci
      CLIENT_IMAGE: cloudsight-client:ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.prod.yml config

      - name: Build Server Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: false
          tags: cloudsight-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Client Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          push: false
          tags: cloudsight-client:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
