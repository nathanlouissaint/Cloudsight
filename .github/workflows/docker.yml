name: CloudSight Docker

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Validate Production Docker

    runs-on: ubuntu-latest

    env:
      SERVER_IMAGE: cloudsight-server:ci
      CLIENT_IMAGE: cloudsight-client:ci
      POSTGRES_PASSWORD: docker-validation-password
      DATABASE_URL: postgresql://cloudsight:docker-validation-password@postgres:5432/cloudsight
      JWT_SECRET: docker-validation-jwt-secret-material-32-bytes
      CSRF_SECRET: docker-validation-csrf-secret-material-32-bytes
      CORS_ORIGIN: http://localhost

    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.prod.yml config

      - name: Build Server Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: false
          tags: cloudsight-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Client Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./client/Dockerfile
          push: false
          tags: cloudsight-client:ci
          build-args: |
            PUBLIC_API_URL=/api
            PUBLIC_MICROSOFT_LOGIN_ENABLED=${{ vars.VITE_MICROSOFT_AUTH_ENABLED || 'false' }}
            PUBLIC_GITHUB_LOGIN_ENABLED=${{ vars.VITE_GITHUB_AUTH_ENABLED || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
