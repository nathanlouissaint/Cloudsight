name: Publish Approved Scorecard Migrator

on:
  workflow_dispatch:

# GITHUB_TOKEN is short-lived. This workflow intentionally has no access to
# repository, Render, Neon, or application environment secrets.
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-approved-scorecard-migrator
  cancel-in-progress: false

env:
  APPROVED_SHA: a301746dc0d050db80ae5e9851b181b8affae433
  IMAGE: ghcr.io/nathanlouissaint/cloudsight-migrator
  IMAGE_TAG: a301746dc0d050db80ae5e9851b181b8affae433

jobs:
  publish:
    name: Build and publish approved migrator only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the approved source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 1

      - name: Verify detached approved source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git symbolic-ref -q HEAD || true)" = ""
          test -f server/Dockerfile
          test -f server/prisma/migrations/20261103180000_add_saas_scorecard_leads/migration.sql
          test -f server/prisma/migrations/20261110160000_add_growth_lab_scorecard_fields/migration.sql

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish migrator image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          target: migrator
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.APPROVED_SHA }}
            org.opencontainers.image.source=https://github.com/nathanlouissaint/Cloudsight
          provenance: mode=max
          sbom: true

      - name: Verify immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          printf 'IMAGE_REF=%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        id: attest
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify published provenance
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
          printf 'ATTESTATION=%s\n' "${{ steps.attest.outputs.attestation-url }}" >> "$GITHUB_STEP_SUMMARY"
