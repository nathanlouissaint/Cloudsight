# CI-only overrides. Compose these with docker-compose.prod.yml; never use this file for deployment.
services:
  postgres:
    container_name: cloudsight-postgres-ci
    volumes:
      - cloudsight_postgres_ci_data:/var/lib/postgresql/data

  redis:
    container_name: cloudsight-redis-ci

  migrate:
    container_name: cloudsight-migrate-ci
    image: cloudsight-server-ci
    build:
      context: .
      dockerfile: ./server/Dockerfile
      target: migrator

  server:
    container_name: cloudsight-server-ci
    image: cloudsight-server-ci
    build:
      context: .
      dockerfile: ./server/Dockerfile

  client:
    container_name: cloudsight-client-ci
    image: cloudsight-client-ci
    build:
      context: .
      dockerfile: ./client/Dockerfile

volumes:
  cloudsight_postgres_ci_data:
