services:
  postgres:
    image: postgres:16
    container_name: cloudsight-postgres-prod
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cloudsight}

    volumes:
      - cloudsight_postgres_prod_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-cloudsight} -d ${POSTGRES_DB:-cloudsight}
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - cloudsight-network

    security_opt:
      - no-new-privileges:true

  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    container_name: cloudsight-server-prod

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-lax}
      FRONTEND_AUTH_COMPLETE_URL: ${FRONTEND_AUTH_COMPLETE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_AUTHORITY: ${ENTRA_AUTHORITY:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-}
      ENTRA_ALLOWED_TENANT_IDS: ${ENTRA_ALLOWED_TENANT_IDS:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}

    expose:
      - "5001"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider -q http://localhost:5001/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - cloudsight-network

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp

  client:
    image: ${CLIENT_IMAGE:?CLIENT_IMAGE is required}
    container_name: cloudsight-client-prod

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      server:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider -q http://127.0.0.1/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - cloudsight-network

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

volumes:
  cloudsight_postgres_prod_data:

networks:
  cloudsight-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
